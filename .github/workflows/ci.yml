name: CI

# The frontend's lint, test and build, through malf-toolchain's one Node CI workflow: the job body
# (checkout, Node with the npm cache, `npm ci`, each logged command under `pipefail` appended to
# build.log, the advisory Sift dogfood over that log) is written once there, for every CodeRoast
# TypeScript repository; this file names only the commands and the token the dogfood needs.
# PUBLIC repository: the job runs on the workflow's hosted default, and `runs-on` is never passed.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write        # Sift dogfood: the commit comment on a regression
      pull-requests: write   # Sift dogfood: comment on same-repo PRs + seed on push; fork PRs skipped (read-only token anyway)
      actions: write         # Sift dogfood: upload the baseline-log artifact (+ read for last-green resolution)
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-node-ci.yml@a9caf9fd6e9af77be9ffc75d6e7c42d46639c2c7
    with:
      node-version: '22'
      logged: |
        npm run lint
        npm test
        npm run build
