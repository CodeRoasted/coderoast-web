name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write
  pull-requests: write   # Sift dogfood: comment on same-repo PRs + seed on push; fork PRs skipped (read-only token anyway)
  actions: write         # Sift dogfood: upload the baseline-log artifact (+ read for last-green resolution)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start build-log capture (lint/test/build below append; Sift diffs it)
        run: truncate --size 0 "$GITHUB_WORKSPACE/build.log"

      # `shell: bash` on the three steps below is load-bearing, not style. The default runner
      # shell is `bash -e {0}`, and `-e` reads the exit status of a PIPELINE's LAST command —
      # here `tee`, which always succeeds. So `npm … 2>&1 | tee …` reported success whatever
      # the command did: these three steps were structurally incapable of failing, and they are
      # the ONLY verification this workflow performs (the Sift step below is
      # `continue-on-error`). `shell: bash` selects `bash --noprofile --norc -eo pipefail {0}`;
      # `pipefail` is the word that matters.
      #
      # Measured 2026-08-22: the shape landed 67ede04 (2026-06-03). Across the 118 runs since,
      # 117 were green and the one red died outside these three steps — while the 29 runs before
      # it failed 8 times. A gate's failure rate collapsing to zero is the tell. On the sibling
      # repo where the identical shape was found the same day (sift-action), it was hiding a test
      # suite that had stopped executing entirely.
      - name: Lint
        shell: bash
        run: npm run lint 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Test
        shell: bash
        run: npm test 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Build
        shell: bash
        run: npm run build 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Sift — structural diff of this run's lint/test/build log (advisory)
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        continue-on-error: true    # advisory: a Sift error must NEVER fail this build
        uses: CodeRoasted/sift-action@v1
        with:
          log: build.log
          fail-on: none
          commit-comment: regression
          changed-outcome: ${{ job.status }}   # the NATIVE token — the engine maps it four-class (ADR 0025)