name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'technical_docs/**'
  push:
    branches: [ main ]
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write
  pull-requests: write   # Sift dogfood: comment on same-repo PRs + seed on push; fork PRs skipped (read-only token anyway)
  actions: write         # Sift dogfood: upload the baseline-log artifact (+ read for last-green resolution)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start build-log capture (lint/test/build below append; Sift diffs it)
        run: truncate --size 0 "$GITHUB_WORKSPACE/build.log"

      - name: Lint
        run: npm run lint 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Test
        run: npm test 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Build
        run: npm run build 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Sift — structural diff of this run's lint/test/build log (advisory)
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        continue-on-error: true    # advisory: a Sift error must NEVER fail this build
        uses: CodeRoasted/sift-action@v1
        with:
          log: build.log
          fail-on: none
          commit-comment: regression
          build-status: ${{ job.status == 'success' && 'green' || 'red' }}