<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Mug body -->
  <g>
    <!-- Handle (with brighter outline for contrast) -->
    <path d="M 155 108
             C 178 108, 178 145, 155 145"
          fill="none"
          stroke="#141414"
          stroke-width="11"
          stroke-linecap="round"/>
    <path d="M 155 108
             C 178 108, 178 145, 155 145"
          fill="none"
          stroke="#6E6E6E"
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- Main mug shape - dark with visible outline for contrast -->
    <path d="M 55 92
             L 155 92
             L 149 168
             Q 149 178, 139 178
             L 71 178
             Q 61 178, 61 168
             Z"
          fill="#141414"
          stroke="#6E6E6E"
          stroke-width="1.8"
          stroke-linejoin="round"/>

    <!-- Mug rim (top edge, very dark for depth) -->
    <ellipse cx="105" cy="92" rx="50" ry="8"
             fill="#080808"
             stroke="#6E6E6E"
             stroke-width="1.8"/>

    <!-- Inside of mug (medium gray to show depth) -->
    <ellipse cx="105" cy="92" rx="46" ry="6" fill="#2E2E2E"/>

    <!-- Coffee surface (contained INSIDE the rim) -->
    <ellipse cx="105" cy="93" rx="43" ry="5" fill="#3D2817"/>
    <ellipse cx="105" cy="92.5" rx="42" ry="4.2" fill="#5C3A1F"/>

    <!-- Coffee highlight -->
    <ellipse cx="95" cy="91" rx="14" ry="1.2" fill="#8B5A3C" opacity="0.5"/>

    <!-- Crema bubbles -->
    <circle cx="118" cy="93" r="0.8" fill="#8B5A3C" opacity="0.6"/>
    <circle cx="88" cy="94" r="0.6" fill="#8B5A3C" opacity="0.5"/>

    <!-- CodeRoast text on the mug (shifted left, centered on body excluding handle) -->
    <text x="99" y="140"
          text-anchor="middle"
          font-family="Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
          font-size="13"
          font-weight="700">
      <tspan fill="#FF9800">Code</tspan><tspan fill="#FFFFFF">Roast</tspan>
    </text>
  </g>

  <!-- Flames emerging FROM the coffee surface -->
  <g>
    <!-- Outer flame (red-orange) -->
    <path d="M 70 93
             Q 60 75, 68 58
             Q 73 68, 76 58
             Q 74 42, 84 32
             Q 86 47, 92 40
             Q 90 24, 100 14
             Q 105 30, 110 24
             Q 113 37, 120 32
             Q 118 47, 128 44
             Q 130 60, 136 57
             Q 142 75, 140 93
             Z"
          fill="#FF5722"/>

    <!-- Middle flame (orange) -->
    <path d="M 78 93
             Q 70 75, 78 60
             Q 82 69, 86 60
             Q 85 47, 92 40
             Q 95 52, 100 44
             Q 100 30, 107 24
             Q 111 38, 116 33
             Q 118 48, 123 45
             Q 128 60, 128 93
             Z"
          fill="#FF9800"/>

    <!-- Inner flame (yellow) -->
    <path d="M 88 93
             Q 84 78, 90 62
             Q 93 70, 96 60
             Q 98 50, 103 44
             Q 105 56, 109 52
             Q 112 65, 114 93
             Z"
          fill="#FFC107"/>

    <!-- Hot core (bright yellow) -->
    <path d="M 96 93
             Q 94 75, 100 65
             Q 104 75, 105 93
             Z"
          fill="#FFEB3B"/>
  </g>
</svg>
