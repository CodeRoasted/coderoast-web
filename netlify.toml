[build]
  command = "npm run build"
  publish = "dist"

# Set production API endpoint (proxied through coderoast.fr/api)
[build.environment]
  VITE_API_BASE = "https://coderoast.fr/api"

# Proxy /api/* requests to VPS backend (152.228.134.160)
[[redirects]]
  from = "/api/*"
  to = "http://152.228.134.160:8080/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
