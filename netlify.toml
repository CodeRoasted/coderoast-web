[build]
  command = "npm run build"
  publish = "dist"

# Set production API endpoint (proxied through coderoast.fr/api)
[build.environment]
  VITE_API_BASE = "https://coderoast.fr/api"

# Redirect /api/* to api.coderoast.fr
[[redirects]]
  from = "/api/*"
  to = "https://api.coderoast.fr/:splat"
  status = 307
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
