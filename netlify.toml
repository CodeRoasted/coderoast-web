[build]
  command = "npm run build"
  publish = "dist"

# Set production API endpoint (direct to api.coderoast.fr, not through Netlify)
[build.environment]
  VITE_API_BASE = "https://api.coderoast.fr/api/v1"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# The product page moved from /sift to /tamys (RUL-279). Every Action release before the first one
# named Tamys links its report footer to /sift, and a pinned release keeps that link for good, so
# the old path answers with a permanent redirect (ADR-6.D24 item 4: a published reader's name).
[[redirects]]
  from = "/sift"
  to = "/tamys"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
