[build]
  command = "npm run build"
  publish = "dist"

# Set production API endpoint (direct to api.coderoast.fr, not through Netlify)
[build.environment]
  VITE_API_BASE = "https://api.coderoast.fr"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
